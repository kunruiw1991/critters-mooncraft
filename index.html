<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>🐱🌙 🚀🌕 🧟⚔️</title>
  <link rel="icon" href="icons/catnap.jpg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <canvas id="gameCanvas"></canvas>

    <!-- Top Bright Pastel HUD Bar (100% Zero-Text Icon UI) -->
    <header id="topBar">
      <div class="hud-left">
        <button id="pauseBtn" class="icon-btn" aria-label="pause">⏸</button>
        <button id="replayCineBtn" class="icon-btn" aria-label="cutscene">🎬</button>
        <button id="camZoomBtn" class="icon-btn" aria-label="zoom">🗺️</button>
        <div id="stageBar" class="stage-bar">
          <button class="stage-btn active" data-stage="0">1️⃣</button>
          <button class="stage-btn" data-stage="1">2️⃣</button>
          <button class="stage-btn" data-stage="2">3️⃣</button>
          <button class="stage-btn" data-stage="3">4️⃣</button>
          <button class="stage-btn" data-stage="4">5️⃣</button>
        </div>
      </div>

      <!-- 4 Layered Production Materials + Base Hearts + Moon Shard Goal -->
      <div class="hud-center">
        <div class="res-chip sun-chip" id="sunChip">
          <span class="res-ico">☀️</span>
          <span id="sunCount">110</span>
        </div>
        <div class="res-chip wood-chip" id="woodChip">
          <span class="res-ico">🪵</span>
          <span id="woodCount">35</span>
        </div>
        <div class="res-chip stone-chip" id="stoneChip">
          <span class="res-ico">🪨</span>
          <span id="stoneCount">30</span>
        </div>
        <div class="res-chip crystal-chip" id="crystalChip">
          <span class="res-ico">💎</span>
          <span id="crystalCount">15</span>
        </div>
        <div class="res-chip hp-chip" id="hpChip">
          <span class="res-ico">❤️</span>
          <span id="hpCount">25</span>
        </div>

        <div class="moon-progress-wrap">
          <span class="moon-ico">🌑</span>
          <div class="moon-bar-bg">
            <div id="moonBarFill" class="moon-bar-fill" style="width: 0%"></div>
          </div>
          <span class="moon-ico">🌕</span>
          <span id="moonShardText" class="moon-num">0/30</span>
          <button id="craftMoonBtn" class="craft-moon-btn" aria-label="craft-moon">
            <span>⚗️➔🌕</span>
          </button>
        </div>
      </div>

      <div class="hud-right">
        <button id="waveBtn" class="action-pill wave-pill" aria-label="wave">
          <span>🧟⚡</span>
        </button>
        <button id="sandboxBtn" class="icon-btn" aria-label="sandbox">🧱</button>
        <button id="musicBtn" class="icon-btn" aria-label="music">🎵</button>
        <button id="sfxBtn" class="icon-btn" aria-label="sound">🔊</button>
      </div>
    </header>

    <!-- 10-Second Opening Cutscene 3-Step Visual Picture Pill (Zero Text) -->
    <div id="cineBanner" class="cine-banner hidden">
      <div class="cine-steps">
        <div id="cineStep1" class="cine-step active">🐱🌙</div>
        <span class="cine-arrow">➔</span>
        <div id="cineStep2" class="cine-step">🚀🌕</div>
        <span class="cine-arrow">➔</span>
        <div id="cineStep3" class="cine-step">🧟⚔️</div>
      </div>
      <div class="cine-progress-track">
        <div id="cineProgressFill" class="cine-progress-fill"></div>
      </div>
      <button id="skipCineBtn" class="skip-btn" aria-label="skip">⏭️</button>
    </div>

    <!-- Pure-Icon Visual Toast Pill (Zero Text) -->
    <div id="bubble" class="bubble hidden"></div>

    <!-- Bottom Minecraft Critter Builder Hotbar + Visual Recipe Pill -->
    <footer id="bottomDock">
      <div id="unitInfo" class="recipe-pill"></div>
      <div id="hotbar" class="hotbar"></div>
    </footer>

    <!-- Pure-Icon Stage Clear & Moon Restored Celebration Modal -->
    <div id="victoryModal" class="modal-backdrop hidden">
      <div class="modal-card">
        <div class="modal-stars">⭐ ⭐ ⭐</div>
        <div class="modal-hero-row">
          <span class="modal-big-ico">🌕</span>
          <img src="icons/catnap.jpg" alt="" class="modal-portrait" />
          <span class="modal-big-ico">🎉</span>
        </div>
        <div id="modalStageBadge" class="modal-stage-badge">1️⃣ ➔ 2️⃣</div>
        <div class="modal-btn-row">
          <button id="nextStageBtn" class="big-play-btn next-btn" aria-label="next">▶️➡️</button>
          <button id="continueBtn" class="big-play-btn continue-btn" aria-label="continue">🧱✨</button>
          <button id="restartBtn" class="big-play-btn replay-btn" aria-label="replay">🔄🎬</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/vendor/three.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
